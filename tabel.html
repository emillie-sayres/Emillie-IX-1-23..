<!DOCTYPE html>
<html>
<head>
    <title>Table Rowspan Colspan</title>
    <link rel="stylesheet" href="tabel.css">
</head>

<body>

<table>
    <colgroup>
        <col><col><col><col><col>
        <col><col><col><col><col>
    </colgroup>

    <tr>
        <td class="blue" rowspan="3">1</td>
        <td class="blue" colspan="2">2</td>
        <td class="blue" colspan="3">3</td>
        <td class="blue" rowspan="4">4</td>
        <td class="blue" rowspan="4">5</td>
        <td class="blue" rowspan="2">6</td>
        <td class="blue" rowspan="6">7</td>
    </tr>

    <tr>
        <td class="pink">8</td>
        <td class="pink">9</td>
        <td class="pink" colspan="3">10</td>
    </tr>

    <tr>
        <td class="blue">11</td>
        <td class="blue">12</td>
        <td class="blue">13</td>
        <td class="blue" colspan="2">14</td>
        <td class="blue" rowspan="3">15</td>
    </tr>

    <tr>
        <td class="pink" colspan="6">16</td>
    </tr>

    <tr>
        <td class="blue" rowspan="2">17</td>
        <td class="blue" colspan="2">18</td>
        <td class="blue" rowspan="2">19</td>
        <td class="blue" colspan="4">20</td>
    </tr>

    <tr>
        <td class="pink">21</td>
        <td class="pink">22</td>
        <td class="pink" colspan="5">23</td>
    </tr>

</table>

</body>
</html>
